name: Release on Push or Manual Dispatch

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (will be automatically extracted from header.rpy if not specified)'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'

    - name: Extract version from header.rpy
      id: get_version
      run: |
        version=$(grep 'maica_sv_ver = ' game/Submods/MAICA_ServerSubmod/header.rpy | cut -d'"' -f2)
        echo "Extracted version: $version"
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Use provided or extracted version
      id: set_version
      run: |
        version="${{ github.event.inputs.version }}"
        if [ -z "$version" ]; then
          version="${{ steps.get_version.outputs.version }}"
        fi
        echo "Using version: $version"
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Check if release exists
      id: check_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        release=$(curl -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.set_version.outputs.version }})

        if echo "$release" | grep -q "message.*Not Found"; then
          echo "Release does not exist"
          echo "create_release=true" >> $GITHUB_OUTPUT
        else
          echo "Release already exists"
          echo "create_release=false" >> $GITHUB_OUTPUT
        fi

    - name: Prepare release assets
      if: steps.check_release.outputs.create_release == 'true'
      run: |
        # Create necessary directories
        mkdir -p game/Submods/MAICA_ServerSubmod/bin

        # Download MAICA assets
        wget -O game/Submods/MAICA_ServerSubmod/env_basis https://github.com/PencilMario/MAICA/releases/latest/download/env_basis
        wget -O game/Submods/MAICA_ServerSubmod/create_account.exe https://github.com/PencilMario/MAICA/releases/latest/download/create_account.exe
        wget -O game/Submods/MAICA_ServerSubmod/maica_starter.exe https://github.com/PencilMario/MAICA/releases/latest/download/maica_starter.exe

        # Download mi-search Windows binary
        wget -O game/Submods/MAICA_ServerSubmod/bin/mi-serp-precompiled-binary-win.exe https://github.com/edgeinfinity1/mi-search-mcp/releases/latest/download/mi-serp-precompiled-binary-win.exe

    - name: Extract backend compatibility metadata
      if: steps.check_release.outputs.create_release == 'true'
      id: backend_version
      run: |
        backend_ver=$(grep "MAICA_CURR_VERSION = " game/Submods/MAICA_ServerSubmod/env_basis | cut -d"'" -f2)
        blessland_capv=$(grep "MAICA_BLESSLAND_CAPV = " game/Submods/MAICA_ServerSubmod/env_basis | cut -d"'" -f2)
        if [ -z "$backend_ver" ] || [ -z "$blessland_capv" ]; then
          echo "Failed to extract MAICA_CURR_VERSION or MAICA_BLESSLAND_CAPV from env_basis"
          exit 1
        fi
        echo "backend_version=$backend_ver" >> $GITHUB_OUTPUT
        echo "backend_blessland_capv=$blessland_capv" >> $GITHUB_OUTPUT
        echo "Backend version: $backend_ver"
        echo "Backend-required Blessland minimum: $blessland_capv"

    - name: Get latest commits
      if: steps.check_release.outputs.create_release == 'true'
      id: commits
      run: |
        # Get the last 10 commits with their messages
        git log --oneline -10 > /tmp/commits.txt
        # Read and properly escape for GitHub Actions output
        {
          echo "commits<<EOF"
          cat /tmp/commits.txt
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Extract version constraints
      if: steps.check_release.outputs.create_release == 'true'
      id: version_constraints
      run: |
        min_ver=$(grep 'dependencies=' game/Submods/MAICA_ServerSubmod/header.rpy | grep -oP '\("[\d.]+",\s*"[\d.]+"\)' | cut -d'"' -f2)
        max_ver=$(grep 'dependencies=' game/Submods/MAICA_ServerSubmod/header.rpy | grep -oP '\("[\d.]+",\s*"[\d.]+"\)' | cut -d'"' -f4)
        blessland_capv="${{ steps.backend_version.outputs.backend_blessland_capv }}"

        version_ge() { printf '%s\n%s' "$2" "$1" | sort -V -C; }
        version_gt() { version_ge "$1" "$2" && [ "$1" != "$2" ]; }

        if [ -z "$min_ver" ] || [ -z "$max_ver" ]; then
          echo "Failed to extract MAICA Blessland version constraints from header.rpy"
          exit 1
        fi

        if version_gt "$blessland_capv" "$max_ver"; then
          echo "Backend requires MAICA Blessland >= $blessland_capv, but this submod supports at most $max_ver"
          exit 1
        fi

        effective_min_ver="$min_ver"
        if version_gt "$blessland_capv" "$min_ver"; then
          effective_min_ver="$blessland_capv"
        fi

        echo "min_version=$min_ver" >> $GITHUB_OUTPUT
        echo "max_version=$max_ver" >> $GITHUB_OUTPUT
        echo "backend_blessland_capv=$blessland_capv" >> $GITHUB_OUTPUT
        echo "effective_min_version=$effective_min_ver" >> $GITHUB_OUTPUT
        echo "Submod Blessland constraints: $min_ver - $max_ver"
        echo "Effective Blessland constraints: $effective_min_ver - $max_ver"

    - name: Create zip package
      if: steps.check_release.outputs.create_release == 'true'
      run: |
        zip -r MAICA_Server_Submod-${{ steps.set_version.outputs.version }}.zip . \
          -x '.git*' \
          -x '.github*' \
          -x '*.git*'

    - name: Download MAICA_ChatSubmod compatible release
      if: steps.check_release.outputs.create_release == 'true'
      run: |
        min_ver="${{ steps.version_constraints.outputs.effective_min_version }}"
        max_ver="${{ steps.version_constraints.outputs.max_version }}"

        version_ge() { printf '%s\n%s' "$2" "$1" | sort -V -C; }
        version_le() { printf '%s\n%s' "$1" "$2" | sort -V -C; }

        releases=$(curl -s -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/Mon1-innovation/MAICA_ChatSubmod/releases?per_page=50")

        found=false
        while read -r release; do
          tag=$(echo "$release" | jq -r '.tag_name')
          normalized_tag="${tag#v}"

          if version_ge "$normalized_tag" "$min_ver" && version_le "$normalized_tag" "$max_ver"; then
            download_url=$(echo "$release" | jq -r '.assets[] | select(.name | test("MAICA_ChatSubmod-.*\\.zip")) | .browser_download_url' | head -1)

            if [ -n "$download_url" ]; then
              filename=$(basename "$download_url")
              echo "Found compatible version $tag (effective constraints: $min_ver - $max_ver)"
              echo "Downloading from: $download_url"
              wget -O "$filename" "$download_url"
              echo "Successfully downloaded: $filename"
              found=true
              break
            fi
          fi
        done < <(echo "$releases" | jq -c '.[]')

        if [ "$found" = false ]; then
          echo "No compatible MAICA_ChatSubmod release found within effective version constraints ($min_ver - $max_ver)"
          exit 1
        fi

    - name: Create Release
      if: steps.check_release.outputs.create_release == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.set_version.outputs.version }}
        body: |
          ## Backend Version
          This release uses backend version: **${{ steps.backend_version.outputs.backend_version }}**

          ## MAICA Blessland Compatibility
          Backend-required Blessland minimum: **${{ steps.version_constraints.outputs.backend_blessland_capv }}**
          Packaged Blessland search range: **${{ steps.version_constraints.outputs.effective_min_version }} - ${{ steps.version_constraints.outputs.max_version }}**

          ## Latest Commits
          ```
          ${{ steps.commits.outputs.commits }}
          ```
        files: |
          MAICA_Server_Submod-${{ steps.set_version.outputs.version }}.zip
          MAICA_ChatSubmod-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Skip release if already exists
      if: steps.check_release.outputs.create_release == 'false'
      run: |
        echo "Release ${{ steps.set_version.outputs.version }} already exists. Skipping release creation."
