name: Sync Upstream MAICA Release

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  repository_dispatch:
    types: [sync-maica-release]
  workflow_dispatch:

jobs:
  sync-maica-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        pip install packaging

    - name: Get latest MAICA release
      id: get_maica_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        release_info=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/PencilMario/MAICA/releases/latest)
        latest_tag=$(echo "$release_info" | grep -o '"tag_name": "[^"]*"' | head -1 | cut -d'"' -f4)
        if [ -z "$latest_tag" ]; then
          echo "Error: Could not fetch latest MAICA release"
          exit 1
        fi
        echo "Latest MAICA release: $latest_tag"
        echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

    - name: Check if already synced
      id: check_sync
      run: |
        if [ -f ".github/last-synced-maica-version" ]; then
          last_synced=$(cat .github/last-synced-maica-version)
          echo "Last synced version: $last_synced"
          echo "last_synced=$last_synced" >> $GITHUB_OUTPUT
        else
          echo "No previous sync found"
          echo "last_synced=" >> $GITHUB_OUTPUT
        fi

    - name: Determine if update needed
      id: should_update
      run: |
        latest_tag="${{ steps.get_maica_release.outputs.latest_tag }}"
        last_synced="${{ steps.check_sync.outputs.last_synced }}"
        if [ "$latest_tag" = "$last_synced" ]; then
          echo "Already synced with this version"
          echo "update_needed=false" >> $GITHUB_OUTPUT
        else
          echo "New version detected, update needed"
          echo "update_needed=true" >> $GITHUB_OUTPUT
        fi

    - name: Extract and update version
      if: steps.should_update.outputs.update_needed == 'true'
      id: version_update
      run: |
        python3 << 'EOF'
        import re
        import os
        from packaging.version import Version

        header_file = "game/Submods/MAICA_ServerSubmod/header.rpy"

        # Extract current version from header.rpy
        with open(header_file, 'r', encoding='utf-8') as f:
            content = f.read()
            match = re.search(r'maica_sv_ver = "([^"]+)"', content)
            if not match:
                raise ValueError("Could not find maica_sv_ver in header.rpy")
            current_ver = match.group(1)

        print(f"Current version: {current_ver}")

        # Parse version using packaging library
        try:
            parsed = Version(current_ver)
        except Exception as e:
            raise ValueError(f"Invalid version format: {current_ver}") from e

        # Increment patch version
        new_patch = parsed.micro + 1
        new_ver = f"{parsed.major}.{parsed.minor}.{new_patch}"

        print(f"New version: {new_ver}")

        # Validate new version
        try:
            Version(new_ver)
        except Exception as e:
            raise ValueError(f"Generated invalid version: {new_ver}") from e

        # Output to GitHub Actions
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"current_ver={current_ver}\n")
            f.write(f"new_ver={new_ver}\n")

        print("Version extraction and increment successful")
        EOF

    - name: Update header.rpy
      if: steps.should_update.outputs.update_needed == 'true'
      run: |
        python3 << 'EOF'
        import re

        current_ver = "${{ steps.version_update.outputs.current_ver }}"
        new_ver = "${{ steps.version_update.outputs.new_ver }}"
        header_file = "game/Submods/MAICA_ServerSubmod/header.rpy"

        # Read file
        with open(header_file, 'r', encoding='utf-8') as f:
            content = f.read()

        # Replace version using regex
        new_content = re.sub(
            rf'maica_sv_ver = "{re.escape(current_ver)}"',
            f'maica_sv_ver = "{new_ver}"',
            content
        )

        if new_content == content:
            raise ValueError(f"Failed to update version: pattern not found")

        # Write file
        with open(header_file, 'w', encoding='utf-8') as f:
            f.write(new_content)

        # Verify replacement
        with open(header_file, 'r', encoding='utf-8') as f:
            updated_content = f.read()
            if f'maica_sv_ver = "{new_ver}"' not in updated_content:
                raise ValueError("Version verification failed")

        print(f"Successfully updated maica_sv_ver from {current_ver} to {new_ver}")
        print("Version verification passed")
        EOF

    - name: Update tracking file
      if: steps.should_update.outputs.update_needed == 'true'
      run: |
        latest_tag="${{ steps.get_maica_release.outputs.latest_tag }}"
        echo "$latest_tag" > .github/last-synced-maica-version
        echo "Updated last-synced-maica-version to $latest_tag"

    - name: Commit and push changes
      if: steps.should_update.outputs.update_needed == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        new_ver="${{ steps.version_update.outputs.new_ver }}"
        latest_tag="${{ steps.get_maica_release.outputs.latest_tag }}"

        git add game/Submods/MAICA_ServerSubmod/header.rpy .github/last-synced-maica-version
        git commit -m "chore: sync upstream MAICA release $latest_tag - Update maica_sv_ver to $new_ver"
        git push origin main

    - name: Trigger release workflow
      if: steps.should_update.outputs.update_needed == 'true'
      run: |
        gh workflow run release.yml --ref main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Skip if no update needed
      if: steps.should_update.outputs.update_needed == 'false'
      run: |
        echo "No new MAICA release detected. Skipping update."
